name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - fm/merge-upstream-2-stage

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Checked out from the pull request head on purpose. This repository's
      # `pull_request` workflows already execute the head's own scripts, so
      # bin/fm-pr-attestation-live.sh sits at that same accepted trust level;
      # only the workflow YAML is read from the base branch, and the
      # attestation verdict stays with the pinned action below.
      - uses: actions/checkout@v6
      # no-mistakes pushes the new head first and re-attests the pull request
      # body second, so a synchronize event's frozen body still names the previous
      # head and a rerun replays that stale payload. Judge the live pull request
      # instead; bin/fm-pr-attestation-live.sh --help owns the wait contract.
      - name: Read the live pull request attestation
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bin/fm-pr-attestation-live.sh --repo "$REPO" --pr "$PR_NUMBER" --output "$GITHUB_OUTPUT"
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          exempt-bot-authors: false
          pr-body: ${{ steps.live.outputs.body }}
          pr-head-sha: ${{ steps.live.outputs.head_sha }}
